[package]
name = "pixfleet"
version = "0.2.3"
description = "Offline image preparation for the web"
edition = "2021"
rust-version = "1.88"

[lib]
name = "pixfleet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "avif"] }
# Match the full security-limits struct used by the pinned libheif 1.23 codec build.
libheif-rs = { version = "3.0", default-features = false, features = ["v1_23"] }
webp = { version = "0.3", default-features = false }
rfd = "0.15"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts"] }
tauri-plugin-updater = "2.9.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
